name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test (race) ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: coverage per package (at least 90 %)
        run: go run ./internal/covercheck 90 cover.out sigv4 eventstream

  # 32-bit little-endian: run the tests natively (int is 32 bits).
  test-386:
    name: test GOARCH=386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: test
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test -count=1 ./...

  # 64-bit big-endian: cross-compile and vet; the test binaries are built too.
  build:
    name: cross-build CGO_ENABLED=0 linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [386, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: build, vet and compile tests
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...
          go vet ./...
          go test -c -o /dev/null ./sigv4
          go test -c -o /dev/null ./eventstream

  fuzz:
    name: fuzz smoke ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzDecode, pkg: ./eventstream }
          - { target: FuzzSign, pkg: ./sigv4 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: fuzz
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s ${{ matrix.pkg }}

  # The independent witness: the same requests signed and the same streams
  # encoded by aws-sdk-go-v2 must give identical bytes (the _bench module,
  # which carries the SDK dependency the library itself does not).
  sdk-witness:
    name: agree with aws-sdk-go-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: same signature, same wire
        working-directory: _bench
        run: go test -count=1 -run '^TestSame' ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
